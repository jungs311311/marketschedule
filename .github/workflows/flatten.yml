name: flatten

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 폴더 두 겹 정리
        run: |
          set -e
          SRC="market-calendar-bot-github/market-calendar-bot"
          if [ ! -d "$SRC" ]; then
            echo "이미 정리되어 있습니다."
            exit 0
          fi
          for item in "$SRC"/* "$SRC"/.[!.]*; do
            [ -e "$item" ] || continue
            git mv -k "$item" .
          done
          rm -rf market-calendar-bot-github
          git rm -q .github/workflows/flatten.yml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "폴더 두 겹 정리"
          git push
