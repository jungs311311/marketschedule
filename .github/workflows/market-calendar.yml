name: market-calendar-bot

on:
  schedule:
    # UTC 기준. 한국시간 = UTC + 9시간.
    # 예약이 밀릴 것을 감안해 일찍 깨우고, 아래 '대기' 단계에서 정각을 맞춘다.
    - cron: '0 20 * * *'   # 05:00 KST → 08:00 발송
    - cron: '0 23 * * *'   # 08:00 KST → 예비
    - cron: '0 9 * * *'    # 18:00 KST → 21:00 발송
    - cron: '0 12 * * *'   # 21:00 KST → 예비
  workflow_dispatch:
    inputs:
      command:
        description: '수동으로 실행할 작업'
        type: choice
        default: once
        options:
          - once
          - chat-id
          - bot-info
          - test-message
          - refresh
          - status
          - render-morning
          - render-evening

permissions:
  contents: write

concurrency:
  group: market-calendar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MARKET_BOT_TOKEN: ${{ secrets.MARKET_BOT_TOKEN }}
      MARKET_BOT_CHAT_ID: ${{ secrets.MARKET_BOT_CHAT_ID }}
      MARKET_BOT_DB: data/marketbot.sqlite3
      MARKET_BOT_STATE: state/state.json
      MARKET_BOT_LOG: data/marketbot.log
      TZ: Asia/Seoul
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 실행
        run: |
          CMD="${{ github.event.inputs.command }}"
          CMD="${CMD:-once}"
          TODAY="$(date +%F)"
          case "$CMD" in
            once)
              # 1) 먼저 공식 일정을 갱신해 둔다
              python -m marketbot state-import
              python -m marketbot refresh || echo "갱신 실패 — 저장된 일정으로 진행"
              python -m marketbot state-export
              # 2) 예약이 밀렸어도 정해진 시각에 보내도록 기다린다
              if [ "${{ github.event_name }}" = "schedule" ]; then
                if [ "$(date +%-H)" -lt 15 ]; then TARGET="08:00"; else TARGET="21:00"; fi
                WAIT=$(( $(date -d "$(date +%F) $TARGET" +%s) - $(date +%s) ))
                if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 18000 ]; then
                  echo "지금 $(date '+%H:%M') KST → $TARGET KST까지 $((WAIT/60))분 대기"
                  sleep "$WAIT"
                else
                  echo "대기 없이 진행 ($(date '+%H:%M') KST, 목표 $TARGET)"
                fi
              fi
              # 3) 발송 (갱신은 이미 했으므로 생략)
              python -m marketbot once --slot auto --no-refresh
              ;;
            refresh)
              python -m marketbot state-import
              python -m marketbot refresh
              python -m marketbot state-export
              ;;
            status)
              python -m marketbot state-import
              python -m marketbot status
              ;;
            render-morning)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot morning
              ;;
            render-evening)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot evening
              ;;
            *)
              python -m marketbot "$CMD"
              ;;
          esac

      - name: 일정 상태 저장
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "state: $(date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash
            git push
          else
            echo "변경된 상태 없음"
          fi
