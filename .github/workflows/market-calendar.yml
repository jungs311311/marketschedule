name: market-calendar-bot

on:
  schedule:
    # UTC 기준. 한국시간 = UTC + 9시간.
    # GitHub이 예약을 자주 건너뛰므로 여러 번 시도하고,
    # 먼저 깨어난 쪽이 목표 시각까지 기다렸다가 보낸다. 중복은 자동으로 걸러진다.
    # 한국 낮~저녁(= 미국 업무시간)은 GitHub이 붐벼 잘 밀리므로 일찍부터 시도한다.
    - cron: '0 20 * * *'    # 05:00 KST → 08:00
    - cron: '40 20 * * *'   # 05:40 KST → 08:00
    - cron: '20 21 * * *'   # 06:20 KST → 08:00
    - cron: '0 22 * * *'    # 07:00 KST → 08:00
    - cron: '40 22 * * *'   # 07:40 KST → 08:00
    - cron: '0 3 * * *'     # 12:00 KST → 21:00
    - cron: '0 4 * * *'     # 13:00 KST → 21:00
    - cron: '0 5 * * *'     # 14:00 KST → 21:00
    - cron: '0 6 * * *'     # 15:00 KST → 21:00
    - cron: '0 7 * * *'     # 16:00 KST → 21:00
    - cron: '0 8 * * *'     # 17:00 KST → 21:00
    - cron: '0 9 * * *'     # 18:00 KST → 21:00
    - cron: '0 10 * * *'    # 19:00 KST → 21:00
    - cron: '0 11 * * *'    # 20:00 KST → 21:00
  workflow_dispatch:
    inputs:
      command:
        description: '수동으로 실행할 작업'
        type: choice
        default: once
        options:
          - once
          - chat-id
          - bot-info
          - test-message
          - refresh
          - status
          - render-morning
          - render-evening

permissions:
  contents: write

concurrency:
  group: market-calendar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 700
    env:
      MARKET_BOT_TOKEN: ${{ secrets.MARKET_BOT_TOKEN }}
      MARKET_BOT_CHAT_ID: ${{ secrets.MARKET_BOT_CHAT_ID }}
      MARKET_BOT_DB: data/marketbot.sqlite3
      MARKET_BOT_STATE: state/state.json
      MARKET_BOT_LOG: data/marketbot.log
      TZ: Asia/Seoul
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 실행
        run: |
          CMD="${{ github.event.inputs.command }}"
          CMD="${CMD:-once}"
          TODAY="$(date +%F)"
          case "$CMD" in
            once)
              # 1) 먼저 공식 일정을 갱신해 둔다
              python -m marketbot state-import
              python -m marketbot refresh || echo "갱신 실패 — 저장된 일정으로 진행"
              python -m marketbot state-export
              if [ "${{ github.event_name }}" = "schedule" ]; then
                # 2) 시계가 아니라 '어느 예약으로 깨어났는가'로 아침·저녁을 정한다
                case "${{ github.event.schedule }}" in
                  '0 20 * * *'|'40 20 * * *'|'20 21 * * *'|'0 22 * * *'|'40 22 * * *')
                    SLOT=morning; TARGET='08:00' ;;
                  *)
                    SLOT=evening; TARGET='21:00' ;;
                esac
                # 3) 예약이 밀렸어도 목표 시각까지 기다린다 (최대 10시간)
                WAIT=$(( $(date -d "$(date +%F) $TARGET" +%s) - $(date +%s) ))
                if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 36000 ]; then
                  echo "지금 $(date '+%H:%M') KST → $TARGET KST까지 $((WAIT/60))분 대기 ($SLOT)"
                  sleep "$WAIT"
                else
                  echo "대기 없이 진행 ($(date '+%H:%M') KST, 목표 $TARGET, $SLOT)"
                fi
                python -m marketbot once --slot "$SLOT" --no-refresh
              else
                python -m marketbot once --slot auto --no-refresh
              fi
              ;;
            refresh)
              python -m marketbot state-import
              python -m marketbot refresh
              python -m marketbot state-export
              ;;
            status)
              python -m marketbot state-import
              python -m marketbot status
              ;;
            render-morning)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot morning
              ;;
            render-evening)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot evening
              ;;
            *)
              python -m marketbot "$CMD"
              ;;
          esac

      - name: 일정 상태 저장
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "state: $(date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash
            git push
          else
            echo "변경된 상태 없음"
          fi
