name: market-calendar-bot

on:
  schedule:
    # UTC 기준. 한국시간 = UTC + 9시간.
    # GitHub은 작업 하나가 최대 6시간이라, 목표 시각 5시간 전보다 이르게는 못 깨운다.
    - cron: '0 20 * * *'    # 05:00 KST → 08:00
    - cron: '40 20 * * *'   # 05:40 KST → 08:00
    - cron: '20 21 * * *'   # 06:20 KST → 08:00
    - cron: '0 22 * * *'    # 07:00 KST → 08:00
    - cron: '40 22 * * *'   # 07:40 KST → 08:00
    - cron: '0 7 * * *'     # 16:00 KST → 21:00
    - cron: '40 7 * * *'    # 16:40 KST → 21:00
    - cron: '20 8 * * *'    # 17:20 KST → 21:00
    - cron: '0 9 * * *'     # 18:00 KST → 21:00
    - cron: '40 9 * * *'    # 18:40 KST → 21:00
    - cron: '20 10 * * *'   # 19:20 KST → 21:00
    - cron: '0 11 * * *'    # 20:00 KST → 21:00
  workflow_dispatch:
    inputs:
      command:
        description: '수동으로 실행할 작업'
        type: choice
        default: once
        options:
          - once
          - chat-id
          - bot-info
          - test-message
          - refresh
          - status
          - render-morning
          - render-evening

permissions:
  contents: write

concurrency:
  group: market-calendar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MARKET_BOT_TOKEN: ${{ secrets.MARKET_BOT_TOKEN }}
      MARKET_BOT_CHAT_ID: ${{ secrets.MARKET_BOT_CHAT_ID }}
      MARKET_BOT_DB: data/marketbot.sqlite3
      MARKET_BOT_STATE: state/state.json
      MARKET_BOT_LOG: data/marketbot.log
      TZ: Asia/Seoul
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 실행
        run: |
          CMD="${{ github.event.inputs.command }}"
          CMD="${CMD:-once}"
          TODAY="$(date +%F)"
          case "$CMD" in
            once)
              # 1) 먼저 공식 일정을 갱신해 둔다 (작업 공간 DB에만 저장)
              python -m marketbot state-import
              python -m marketbot refresh || echo "갱신 실패 — 저장된 일정으로 진행"
              if [ "${{ github.event_name }}" = "schedule" ]; then
                # 2) 시계가 아니라 '어느 예약으로 깨어났는가'로 아침·저녁을 정한다
                case "${{ github.event.schedule }}" in
                  '0 20 * * *'|'40 20 * * *'|'20 21 * * *'|'0 22 * * *'|'40 22 * * *')
                    SLOT=morning; TARGET='08:00' ;;
                  *)
                    SLOT=evening; TARGET='21:00' ;;
                esac
                # 3) 예약이 밀렸어도 목표 시각까지 기다린다 (최대 5시간)
                WAIT=$(( $(date -d "$(date +%F) $TARGET" +%s) - $(date +%s) ))
                if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 18000 ]; then
                  echo "지금 $(date '+%H:%M') KST → $TARGET KST까지 $((WAIT/60))분 대기 ($SLOT)"
                  sleep "$WAIT"
                else
                  echo "대기 없이 진행 ($(date '+%H:%M') KST, 목표 $TARGET, $SLOT)"
                fi
              else
                SLOT=auto
              fi
              # 4) 보내기 직전에 저장소의 최신 발송 기록을 받아온다 (합치지 않고 통째로 가져옴)
              if git fetch --quiet origin main && git checkout --quiet origin/main -- state; then
                echo "최신 발송 기록 확인함"
              else
                echo "최신 기록 받기 실패 — 로컬 기록으로 진행"
              fi
              python -m marketbot once --slot "$SLOT" --no-refresh
              ;;
            refresh)
              python -m marketbot state-import
              python -m marketbot refresh
              python -m marketbot state-export
              ;;
            status)
              python -m marketbot state-import
              python -m marketbot status
              ;;
            render-morning)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot morning
              ;;
            render-evening)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot evening
              ;;
            *)
              python -m marketbot "$CMD"
              ;;
          esac

      - name: 일정 상태 저장
        if: always()
        run: |
          [ -f state/state.json ] || { echo "저장할 상태 없음"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/state.json /tmp/state.json
          # 합치기(merge)를 하지 않는다. 최신 저장소 위에 이번 결과를 그대로 얹는다.
          for i in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp /tmp/state.json state/state.json
            git add state
            if git diff --cached --quiet; then
              echo "변경된 상태 없음"; exit 0
            fi
            git commit --quiet -m "state: $(date '+%Y-%m-%d %H:%M KST')"
            if git push --quiet origin HEAD:main; then
              echo "상태 저장 완료"; exit 0
            fi
            echo "저장 재시도 $i"; sleep 10
          done
          echo "상태 저장 실패 — 알림 자체는 이미 발송됨"
