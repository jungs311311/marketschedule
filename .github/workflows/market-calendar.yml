name: market-calendar-bot

on:
  schedule:
    # UTC 기준. 한국시간 = UTC + 9시간.
    # GitHub은 작업 하나가 최대 6시간이라, 목표 시각 5시간 전보다 이르게는 못 깨운다.
    - cron: '0 20 * * *'    # 05:00 KST → 08:00
    - cron: '40 20 * * *'   # 05:40 KST → 08:00
    - cron: '20 21 * * *'   # 06:20 KST → 08:00
    - cron: '0 22 * * *'    # 07:00 KST → 08:00
    - cron: '40 22 * * *'   # 07:40 KST → 08:00
    - cron: '0 7 * * *'     # 16:00 KST → 21:00
    - cron: '40 7 * * *'    # 16:40 KST → 21:00
    - cron: '20 8 * * *'    # 17:20 KST → 21:00
    - cron: '0 9 * * *'     # 18:00 KST → 21:00
    - cron: '40 9 * * *'    # 18:40 KST → 21:00
    - cron: '20 10 * * *'   # 19:20 KST → 21:00
    - cron: '0 11 * * *'    # 20:00 KST → 21:00
  workflow_dispatch:
    inputs:
      command:
        description: '수동으로 실행할 작업'
        type: choice
        default: once
        options:
          - once
          - chat-id
          - bot-info
          - test-message
          - refresh
          - status
          - render-morning
          - render-evening
          - relay
          - relay-morning

permissions:
  contents: write
  actions: write

concurrency:
  group: market-calendar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MARKET_BOT_TOKEN: ${{ secrets.MARKET_BOT_TOKEN }}
      MARKET_BOT_CHAT_ID: ${{ secrets.MARKET_BOT_CHAT_ID }}
      MARKET_BOT_DB: data/marketbot.sqlite3
      MARKET_BOT_STATE: state/state.json
      MARKET_BOT_LOG: data/marketbot.log
      TZ: Asia/Seoul
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리와 한글 글꼴 설치
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f >/dev/null 2>&1 || true

      - name: 실행
        run: |
          relay_call() {
            curl -sS -o /dev/null -w "이어달리기 호출($1): HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/market-calendar.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"command\":\"$1\"}}" || echo "호출 실패 — 예비 예약으로 진행"
          }
          CMD="${{ github.event.inputs.command }}"
          CMD="${CMD:-once}"
          TODAY="$(date +%F)"
          case "$CMD" in
            once)
              python -m marketbot state-import
              python -m marketbot refresh || echo "갱신 실패 — 저장된 일정으로 진행"
              if [ "${{ github.event_name }}" = "schedule" ]; then
                case "${{ github.event.schedule }}" in
                  '0 20 * * *'|'40 20 * * *'|'20 21 * * *'|'0 22 * * *'|'40 22 * * *')
                    SLOT=morning; TARGET='08:00' ;;
                  *)
                    SLOT=evening; TARGET='21:00' ;;
                esac
                WAIT=$(( $(date -d "$(date +%F) $TARGET" +%s) - $(date +%s) ))
                if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 18000 ]; then
                  echo "지금 $(date '+%H:%M') KST → $TARGET KST까지 $((WAIT/60))분 대기 ($SLOT)"
                  sleep "$WAIT"
                else
                  echo "대기 없이 진행 ($(date '+%H:%M') KST, 목표 $TARGET, $SLOT)"
                fi
              else
                SLOT=auto
              fi
              if git fetch --quiet origin main && git checkout --quiet origin/main -- state; then
                echo "최신 발송 기록 확인함"
              else
                echo "최신 기록 받기 실패 — 로컬 기록으로 진행"
              fi
              # 4) 이번에 알림을 보낸 봇이면 다음 알림 이어달리기를 시작한다
              #    아침을 보냈으면 → 저녁(21:00) 이어달리기, 저녁을 보냈으면 → 다음 날 아침(08:00) 이어달리기
              before_morning=$(grep -c "\"$(date +%F):morning\"" state/state.json 2>/dev/null || true)
              before_evening=$(grep -c "\"$(date +%F):evening\"" state/state.json 2>/dev/null || true)
              python -m marketbot once --slot "$SLOT" --no-refresh
              if [ "$before_morning" = 0 ] && grep -q "\"$(date +%F):morning\"" state/state.json; then
                relay_call relay
              fi
              if [ "$before_evening" = 0 ] && grep -q "\"$(date +%F):evening\"" state/state.json; then
                relay_call relay-morning
              fi
              ;;
            relay|relay-morning)
              # relay: 오늘 21:00 저녁 알림 / relay-morning: 다음 08:00 아침 알림
              if [ "$CMD" = relay ]; then
                SLOT=evening; GOAL="$(date +%F) 21:00"
              else
                SLOT=morning
                if [ "$(date +%-H)" -lt 8 ]; then GOAL="$(date +%F) 08:00"; else GOAL="$(date -d tomorrow +%F) 08:00"; fi
              fi
              LEFT=$(( $(date -d "$GOAL" +%s) - $(date +%s) ))
              if [ "$LEFT" -le 0 ]; then
                echo "이미 $GOAL 이 지났습니다 — 이어달리기 종료"
              elif [ "$LEFT" -gt 14400 ]; then
                # 4시간보다 많이 남았으면 최대 5시간 자고 다음 주자를 부른다
                NAP=$(( LEFT - 10800 )); [ "$NAP" -gt 18000 ] && NAP=18000
                echo "$(date '+%H:%M') KST — $((NAP/60))분 뒤 다음 주자 호출 ($GOAL 까지 $((LEFT/60))분)"
                sleep "$NAP"
                relay_call "$CMD"
              else
                # 마지막 주자: 갱신 → 목표 시각까지 대기 → 발송
                python -m marketbot state-import
                python -m marketbot refresh || echo "갱신 실패 — 저장된 일정으로 진행"
                WAIT=$(( $(date -d "$GOAL" +%s) - $(date +%s) ))
                [ "$WAIT" -gt 0 ] && { echo "마지막 주자 — $GOAL 까지 $((WAIT/60))분 대기"; sleep "$WAIT"; }
                git fetch --quiet origin main && git checkout --quiet origin/main -- state || true
                KEY="$(date +%F):$SLOT"
                grep -q "\"$KEY\"" state/state.json 2>/dev/null && SENT_BEFORE=yes || SENT_BEFORE=no
                python -m marketbot once --slot "$SLOT" --no-refresh
                if [ "$SENT_BEFORE" = no ] && grep -q "\"$KEY\"" state/state.json; then
                  [ "$SLOT" = evening ] && relay_call relay-morning || relay_call relay
                fi
              fi
              ;;
            refresh)
              python -m marketbot state-import
              python -m marketbot refresh
              python -m marketbot state-export
              ;;
            status)
              python -m marketbot state-import
              python -m marketbot status
              ;;
            render-morning)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot morning
              ;;
            render-evening)
              python -m marketbot state-import
              python -m marketbot render --date "$TODAY" --slot evening
              ;;
            *)
              python -m marketbot "$CMD"
              ;;
          esac

      - name: 일정 상태 저장
        if: always()
        run: |
          [ -f state/state.json ] || { echo "저장할 상태 없음"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/state.json /tmp/state.json
          for i in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp /tmp/state.json state/state.json
            git add state
            if git diff --cached --quiet; then
              echo "변경된 상태 없음"; exit 0
            fi
            git commit --quiet -m "state: $(date '+%Y-%m-%d %H:%M KST')"
            if git push --quiet origin HEAD:main; then
              echo "상태 저장 완료"; exit 0
            fi
            echo "저장 재시도 $i"; sleep 10
          done
          echo "상태 저장 실패 — 알림 자체는 이미 발송됨"
