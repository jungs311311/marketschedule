name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r requirements.txt
      - name: 원본 저장
        run: |
          mkdir -p /tmp/raw
          python - <<'PY'
          from marketbot.http import HttpClient
          c = HttpClient(timeout=25)
          for name, u in [('bls_cpi.htm','https://www.bls.gov/schedule/news_release/cpi.htm'),
                          ('bls_empsit.htm','https://www.bls.gov/schedule/news_release/empsit.htm'),
                          ('bea.htm','https://www.bea.gov/news/schedule'),
                          ('boj.htm','https://www.boj.or.jp/en/mopo/mpmsche_minu/index.htm'),
                          ('kostat_2026.pdf','https://kostat.go.kr/ansk/file/schedule_2026.pdf')]:
              open('/tmp/raw/'+name,'wb').write(c.get_bytes(u)); print('saved', name)
          PY
          echo done > /tmp/probe.txt
      - name: 결과를 임시 브랜치에 저장
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan probe-results
          git rm -rqf .
          cp /tmp/probe.txt probe.txt; cp /tmp/raw/* .
          git add -A
          git commit -qm probe
          git push -fq origin probe-results
